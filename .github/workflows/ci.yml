# SPDX-License-Identifier: GPL-3.0-only
# Builds and tests every push. A release (zip, GitHub release, manifest.json entry for Jellyfin's
# catalog) is published either on a version tag (v0.1.0.0) or by running this workflow by hand
# on main with "release" ticked (Actions > CI > Run workflow): GitHub then creates the tag itself.
# Either way every check must pass first.
#
# Test results are written to the ci-results branch (latest/ and runs/<commit>/) because the
# full Actions logs aren't readable from the assistant's workspace. Nothing secret is written
# there: every account and key in the live test belongs to a throwaway server that is deleted
# after the run, and the one sign-in the UI test needs is kept outside the results folder.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of the version in Directory.Build.props (main only)"
        type: boolean
        default: false

permissions:
  contents: read

# Explicit bash = bash -eo pipefail. Without it a failing command piped into tee would
# still count as success (this happened in the first runs).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write   # only to publish the ci-results branch
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      RESULTS: ${{ github.workspace }}/results
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare results folder
        run: mkdir -p "$RESULTS"

      - name: Build (Release, warnings are errors)
        id: build
        run: dotnet build src/Jellyfin.Plugin.ProjectA/Jellyfin.Plugin.ProjectA.csproj -c Release 2>&1 | tee "$RESULTS/build.log"

      - name: Unit tests
        id: unit
        env:
          PROJECTA_ENDPOINTS_OUT: ${{ github.workspace }}/results/endpoints.json
        run: |
          dotnet test tests/Jellyfin.Plugin.ProjectA.Tests -c Release \
            --logger "trx;LogFileName=unit.trx" --logger "console;verbosity=normal" \
            --results-directory "$RESULTS/unit" 2>&1 | tee "$RESULTS/unit-tests.log"

      - name: Browser tests (captured Jellyfin 12.4 markup + Jellyfin Enhanced's real header code)
        id: browser
        working-directory: tests/browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm ci --no-audit --no-fund --omit=optional
          npm test 2>&1 | tee "$RESULTS/browser-tests.log"

      - name: Package
        id: package
        run: |
          python3 build/package.py src/Jellyfin.Plugin.ProjectA/bin/Release/net10.0 dist 2>&1 | tee "$RESULTS/package.log"
          cp dist/manifest-entry.json "$RESULTS/"

      - name: Live server test (official Jellyfin 12.4 image + Jellyfin Enhanced 12.14.0.0)
        id: live
        run: |
          python3 tests/integration/live_server.py \
            --zip "$(ls dist/project-a_*.zip | grep -v _source)" \
            --endpoints "$RESULTS/endpoints.json" \
            --out "$RESULTS/live" --keep --creds "$RUNNER_TEMP/live-ui-credentials.json" 2>&1 | tee "$RESULTS/live-server.log"

      - name: Live UI test (real sign-in, header button, More menu, page)
        id: ui
        working-directory: tests/browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node ../integration/live_ui.mjs "$RUNNER_TEMP/live-ui-credentials.json" "$RESULTS/live-ui" 2>&1 | tee "$RESULTS/live-ui.log"

      - name: Stop the test server
        if: always()
        run: |
          docker rm -f projecta-live >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/live-ui-credentials.json"

      - name: Upload release files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

      - name: Report failures as annotations (readable without the Actions log)
        if: always()
        env:
          OUTCOMES: >-
            build=${{ steps.build.outcome }} unit=${{ steps.unit.outcome }} browser=${{ steps.browser.outcome }}
            package=${{ steps.package.outcome }} live=${{ steps.live.outcome }} ui=${{ steps.ui.outcome }}
        run: |
          declare -A LOG=([build]=build.log [unit]=unit-tests.log [browser]=browser-tests.log [package]=package.log [live]=live-server.log [ui]=live-ui.log)
          echo "$OUTCOMES" | tr ' ' '\n' > "$RESULTS/step-outcomes.txt"
          for pair in $OUTCOMES; do
            step=${pair%%=*}; outcome=${pair#*=}
            if [ "$outcome" = "failure" ]; then
              f="$RESULTS/${LOG[$step]}"
              tail_text=$( [ -f "$f" ] && tail -n 60 "$f" | grep -v -E 'Token=|AccessToken' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' || echo "no log file")
              echo "::error title=Step '$step' failed::$tail_text"
            fi
          done

      - name: Publish results to the ci-results branch
        if: always() && github.event_name != 'pull_request'
        env:
          SHA: ${{ github.sha }}
          STATUS: ${{ job.status }}
        run: |
          set -u
          printf '{"commit":"%s","ref":"%s","status":"%s","run":"%s"}\n' "$SHA" "$GITHUB_REF" "$STATUS" "$GITHUB_RUN_ID" > "$RESULTS/run.json"
          # Last line of defence: withhold any file that looks like it holds a credential.
          suspects=$(grep -rIlE 'AccessToken"?[[:space:]]*[:=][[:space:]]*"?[0-9a-fA-F]{32}|Token="[0-9a-fA-F]{32}"' "$RESULTS" || true)
          if [ -n "$suspects" ]; then
            echo "$suspects" | sed "s|^$RESULTS/||" > "$RESULTS/WITHHELD.txt"
            echo "$suspects" | xargs -r rm -f
            echo "::warning title=Results withheld::$(tr '\n' ' ' < "$RESULTS/WITHHELD.txt")"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin ci-results >/dev/null 2>&1; then
            git fetch --depth 1 origin ci-results
            git worktree add ../pub FETCH_HEAD
          else
            git worktree add --detach ../pub HEAD
            (cd ../pub && git checkout -q --orphan ci-results && git rm -rqf . && git clean -fdxq)
          fi
          cd ../pub
          rm -rf latest "runs/$SHA" && mkdir -p runs
          cp -r "$RESULTS" latest && cp -r "$RESULTS" "runs/$SHA"
          ls -1t runs | tail -n +21 | xargs -r -I{} rm -rf "runs/{}"
          git add -A
          git commit -qm "CI results for $SHA ($STATUS)" || true
          git push origin HEAD:refs/heads/ci-results

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release and update manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check the tag matches the version
        run: |
          version=$(grep -oP '(?<=<Version>)[0-9.]+(?=</Version>)' Directory.Build.props)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF' > notes.md
          import json; print(json.load(open("dist/manifest-entry.json"))["changelog"])
          EOF
          # --target: for a hand-started release GitHub creates the tag on the tested commit.
          # Fails (and stops here) if this version was already released.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Project A $VERSION" --notes-file notes.md \
            "dist/project-a_${VERSION}.zip" "dist/project-a_${VERSION}_source.zip"

      - name: Add the release to manifest.json
        run: |
          python3 build/update_manifest.py dist/manifest-entry.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Catalog: add Project A $VERSION"
          git push origin HEAD:main
